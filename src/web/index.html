<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashen Era Archive — Document Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Warm, Calm, Clean Light Theme (Default) */
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-subtle-hover: #e2e8f0;
      --bg-input: #ffffff;

      --border-subtle: #e2e8f0;
      --border-medium: #cbd5e1;
      --border-focus: #d97706;

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --text-faint: #94a3b8;

      --brand: #d97706;
      --brand-hover: #b45309;
      --brand-subtle: #fef3c7;
      --brand-text: #92400e;

      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;

      --warning-bg: #fffbeb;
      --warning-border: #fef08a;
      --warning-text: #854d0e;

      --user-msg-bg: #f1f5f9;
      --user-msg-text: #0f172a;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --sidebar-w: 280px;
      --header-h: 64px;
      --chat-max-w: 800px;
    }

    [data-theme="dark"] {
      --bg-page: #0b0f17;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --bg-subtle: #1e293b;
      --bg-subtle-hover: #334155;
      --bg-input: #111827;

      --border-subtle: #1e293b;
      --border-medium: #334155;
      --border-focus: #f59e0b;

      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-faint: #64748b;

      --brand: #f59e0b;
      --brand-hover: #fbbf24;
      --brand-subtle: rgba(245, 158, 11, 0.15);
      --brand-text: #fde68a;

      --success-bg: rgba(22, 101, 52, 0.2);
      --success-border: rgba(34, 197, 94, 0.3);
      --success-text: #86efac;

      --warning-bg: rgba(133, 77, 14, 0.2);
      --warning-border: rgba(234, 179, 8, 0.3);
      --warning-text: #fde047;

      --user-msg-bg: #1e293b;
      --user-msg-text: #f8fafc;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
      display: flex;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), margin 0.25s;
      z-index: 50;
      height: 100%;
    }

    .sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-w));
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .btn-new-chat {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      transition: all 0.15s ease;
      border: 1px solid var(--border-subtle);
    }

    .btn-new-chat:hover {
      background: var(--bg-subtle-hover);
      border-color: var(--border-medium);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .history-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .history-item-del {
      opacity: 0;
      padding: 3px;
      border-radius: 4px;
      color: var(--text-muted);
      transition: opacity 0.15s, color 0.15s;
    }

    .history-item:hover .history-item-del { opacity: 1; }
    .history-item-del:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

    .history-empty {
      padding: 20px 8px;
      font-size: 12.5px;
      color: var(--text-faint);
      text-align: center;
      line-height: 1.5;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      width: 100%;
      transition: all 0.15s;
    }

    .sidebar-nav-item:hover, .sidebar-nav-item.active {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Viewport */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      background: var(--bg-page);
      position: relative;
    }

    .app-header {
      height: var(--header-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-toggle-sidebar {
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .btn-toggle-sidebar:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-subtle);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .header-btn {
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .header-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    /* Chat Stream Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: var(--chat-max-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Welcome / Landing */
    .welcome-card {
      margin: 40px auto;
      text-align: center;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    .welcome-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--brand-subtle);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.5;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 24px;
    }

    .suggestion-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestion-btn:hover {
      border-color: var(--brand);
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .suggestion-category {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--brand);
      letter-spacing: 0.04em;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.25s ease;
    }

    .message-row.user { align-items: flex-end; }
    .message-row.assistant { align-items: flex-start; }

    .message-author {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .user-bubble {
      background: var(--user-msg-bg);
      color: var(--user-msg-text);
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14.5px;
      max-width: 82%;
      line-height: 1.55;
      border: 1px solid var(--border-subtle);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant-bubble {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .answer-lead {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-main);
    }
    .answer-lead p { margin-bottom: 12px; }
    .answer-lead p:last-child { margin-bottom: 0; }
    .answer-lead strong { color: var(--text-main); font-weight: 700; }
    .answer-lead ul, .answer-lead ol { margin: 10px 0 10px 20px; }
    .answer-lead li { margin-bottom: 4px; }
    .answer-lead code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: var(--bg-subtle);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .answer-lead blockquote {
      border-left: 3px solid var(--brand);
      padding-left: 12px;
      color: var(--text-secondary);
      font-style: italic;
      margin: 10px 0;
    }

    /* Trust & Grounding Status */
    .trust-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      width: fit-content;
    }
    .trust-indicator.verified {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .trust-indicator.warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }

    /* Sources Section */
    .sources-section {
      border-top: 1px solid var(--border-subtle);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sources-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .source-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      transition: all 0.15s;
    }

    .source-card-title {
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-card-quote {
      color: var(--text-muted);
      font-size: 11.5px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* Attached Figure Plate Thumbnail */
    .figure-attachment {
      margin-top: 4px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: inline-flex;
      flex-direction: column;
      max-width: 320px;
      background: var(--bg-subtle);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .figure-attachment:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .figure-attachment img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .figure-attachment-meta {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Assistant Footer Actions */
    .assistant-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 4px;
    }

    .action-subtle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }

    .action-subtle-btn:hover {
      color: var(--text-main);
      background: var(--bg-subtle);
    }

    /* Reasoning Collapsible Drawer */
    .reasoning-drawer {
      display: none;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      animation: fadeIn 0.2s ease;
    }

    .reasoning-drawer.open { display: block; }

    .reasoning-step-item {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .reasoning-step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--brand-subtle);
      color: var(--brand);
      font-weight: 700;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Follow-up Question Pills */
    .follow-ups-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .follow-up-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s;
    }

    .follow-up-pill:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-subtle);
    }

    /* Conversational Loading State */
    .loading-row {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      font-size: 13.5px;
      color: var(--text-muted);
      width: fit-content;
      box-shadow: var(--shadow-sm);
    }

    .loading-row.active { display: inline-flex; }

    .pulse-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
    .pulse-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Bottom Chat Input Dock */
    .input-dock {
      padding: 16px 20px 24px;
      background: linear-gradient(180deg, transparent 0%, var(--bg-page) 20%);
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .input-dock-inner {
      width: 100%;
      max-width: var(--chat-max-w);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-box {
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .chat-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--brand-subtle);
    }

    .chat-textarea {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 14.5px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      max-height: 160px;
      min-height: 24px;
      padding: 4px 0;
    }

    .chat-textarea::placeholder { color: var(--text-faint); }

    .btn-send {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--brand);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--brand-hover);
      transform: translateY(-1px);
    }

    .btn-send:disabled {
      background: var(--bg-subtle-hover);
      color: var(--text-faint);
      cursor: not-allowed;
      transform: none;
    }

    .input-disclaimer {
      font-size: 11.5px;
      color: var(--text-faint);
      text-align: center;
    }


    /* Lightbox Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.visible, .modal-backdrop.active {
      display: flex;
      opacity: 1;
    }
    .lightbox-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .lightbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .lightbox-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .btn-lightbox-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: color 0.15s, background 0.15s;
    }
    .btn-lightbox-close:hover {
      color: var(--text-main);
      background: var(--bg-subtle);
    }
    .lightbox-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      gap: 12px;
    }
    .lightbox-body img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .lightbox-caption {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
      margin: 0;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s;
      z-index: 250;
    }
    .toast.visible, .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar Backdrop & Mobile rules */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.mobile-open, .sidebar-backdrop.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 50;
        margin-left: 0 !important;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .btn-toggle-sidebar {
        display: flex !important;
      }
    }

    @media print {
      .sidebar, .app-header, .input-dock, .toast, .lightbox-modal { display: none !important; }
      body { background: #fff; color: #000; }
      .assistant-bubble { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>
</head>

<!-- ═══ VANILLA JS APPLICATION ═══ -->
<script>
(() => {
  'use strict';

  /* ──────────────────────────────────────────────────
     CONSTANTS & STATE
  ────────────────────────────────────────────────── */
  const STORAGE_KEY  = 'ashen_chats_v4';
  const THEME_KEY    = 'ashen_theme';

  let currentChatId  = null;
  let conversations  = [];
  let isQuerying     = false;

  /* ──────────────────────────────────────────────────
     DOM REFS
  ────────────────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const dom = {
    sidebar         : $('sidebar'),
    sidebarBackdrop : $('sidebar-backdrop'),
    btnMenuToggle   : $('btn-toggle-sidebar') || $('btn-menu-toggle'),
    btnNewChat      : $('btn-new-chat'),
    historyList     : $('history-list'),
    themeBtn        : $('btn-theme'),
    welcomeCard     : $('welcome-card'),
    chatMessages    : $('chat-stream'),
    queryInput      : $('query-input'),
    btnSend         : $('btn-send'),
    lightboxModal   : $('lightbox-modal'),
    lightboxImg     : $('lightbox-img'),
    lightboxTitle   : $('lightbox-title'),
    lightboxCaption : $('lightbox-caption'),
    btnCloseLightbox: $('btn-close-lightbox'),
    appToast        : $('app-toast'),
  };

  /* ──────────────────────────────────────────────────
     UTILITIES
  ────────────────────────────────────────────────── */
  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, ms = 3000) {
    dom.appToast.textContent = msg;
    dom.appToast.classList.add('visible');
    setTimeout(() => dom.appToast.classList.remove('visible'), ms);
  }

  function formatMd(raw) {
    if (!raw) return '';
    let h = esc(raw);
    h = h.replace(/^### (.+)$/gm, '<h4 style="font-size:14px;font-weight:600;margin:10px 0 5px">$1</h4>');
    h = h.replace(/^## (.+)$/gm,  '<h3 style="font-size:15px;font-weight:600;margin:12px 0 6px">$1</h3>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g,     '<em>$1</em>');
    h = h.replace(/`([^`]+)`/g, '<code style="background:var(--bg-muted);padding:2px 5px;border-radius:3px;font-size:12px;font-family:monospace">$1</code>');
    // Lists
    const lines = h.split('\n');
    let inList = false, out = [];
    for (const line of lines) {
      const t = line.trim();
      if (t.startsWith('- ') || t.startsWith('* ')) {
        if (!inList) { out.push('<ul style="margin:6px 0 6px 18px;display:flex;flex-direction:column;gap:3px">'); inList = true; }
        out.push('<li>' + t.slice(2) + '</li>');
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        if (t) out.push('<p style="margin:0 0 8px;line-height:1.65">' + line + '</p>');
      }
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }

  /* ──────────────────────────────────────────────────
     THEME
  ────────────────────────────────────────────────── */
  function initTheme() {
    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);
    if (dom.themeBtn) {
      dom.themeBtn.innerHTML = theme === 'dark'
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  /* ──────────────────────────────────────────────────
     CONVERSATION STORAGE
  ────────────────────────────────────────────────── */
  function loadConversations() {
    try { conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { conversations = []; }
    if (conversations.length) selectConversation(conversations[0].id);
    else startNewChat();
  }
  function saveConversations() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); }
    catch {}
  }
  function startNewChat() {
    currentChatId = 'c' + Date.now();
    conversations.unshift({ id: currentChatId, title: 'New Investigation', ts: Date.now(), messages: [] });
    saveConversations();
    renderHistory();
    renderMessages();
    closeMobileSidebar();
  }
  function selectConversation(id) {
    currentChatId = id;
    renderHistory();
    renderMessages();
    closeMobileSidebar();
  }
  function deleteConversation(id, e) {
    e && e.stopPropagation();
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if (currentChatId === id) {
      conversations.length ? selectConversation(conversations[0].id) : startNewChat();
    } else renderHistory();
  }
  function getActiveChat() { return conversations.find(c => c.id === currentChatId) || null; }

  function renderHistory() {
    if (!dom.historyList) return;
    dom.historyList.innerHTML = '';
    if (!conversations.length) {
      dom.historyList.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">No conversations yet.</div>';
      return;
    }
    conversations.forEach(c => {
      const item = document.createElement('div');
      item.className = 'history-item' + (c.id === currentChatId ? ' active' : '');
      item.onclick = () => selectConversation(c.id);

      const title = document.createElement('span');
      title.className = 'history-title';
      title.textContent = c.title || 'Investigation';

      const del = document.createElement('button');
      del.className = 'history-delete';
      del.title = 'Delete';
      del.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      del.onclick = e => deleteConversation(c.id, e);

      item.appendChild(title);
      item.appendChild(del);
      dom.historyList.appendChild(item);
    });
  }

  /* ──────────────────────────────────────────────────
     MESSAGE RENDERING
  ────────────────────────────────────────────────── */
  function renderMessages() {
    const chat = getActiveChat();
    dom.chatMessages.innerHTML = '';
    if (!chat || !chat.messages.length) {
      dom.welcomeCard.style.display = 'block';
      dom.chatMessages.appendChild(dom.welcomeCard);
      return;
    }
    dom.welcomeCard.style.display = 'none';
    chat.messages.forEach(appendMsg);
    scrollBottom();
  }

  function appendMsg(msg) {
    const wrap = document.createElement('div');
    wrap.className = 'message ' + msg.role;

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar ' + msg.role;
    avatar.innerHTML = msg.role === 'user'
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
      : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

    const body = document.createElement('div');
    body.className = 'message-body';

    if (msg.role === 'user') {
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = msg.content;
      body.appendChild(bubble);
    } else {
      // Trust badge
      if (msg.meta && msg.meta.grounding_status) {
        body.appendChild(buildTrustBadge(msg.meta.grounding_status));
      }
      // Answer bubble
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = formatMd(msg.content);
      body.appendChild(bubble);
      // Figure plate
      if (msg.meta && msg.meta.rich_media && msg.meta.rich_media.has_plate) {
        body.appendChild(buildFigurePlate(msg.meta.rich_media));
      }
      // Sources
      const cits = (msg.meta && (msg.meta.pinpointed_citations || msg.meta.citations)) || [];
      if (cits.length) body.appendChild(buildSources(cits));
      // Verification drawer
      if (msg.meta && (msg.meta.hops || msg.meta.contradictions)) {
        body.appendChild(buildVerification(msg.meta));
      }
      // Follow-ups
      if (msg.meta && msg.meta.investigation_leads && msg.meta.investigation_leads.length) {
        body.appendChild(buildFollowUps(msg.meta.investigation_leads));
      }
      // Copy action
      const actions = document.createElement('div');
      actions.className = 'message-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-copy';
      copyBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
      copyBtn.onclick = () => navigator.clipboard.writeText(msg.content).then(() => showToast('Copied'));
      actions.appendChild(copyBtn);
      body.appendChild(actions);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(body);
    dom.chatMessages.appendChild(wrap);
  }

  function buildTrustBadge(status) {
    const badge = document.createElement('div');
    badge.className = 'trust-badge';
    const cfg = {
      GROUNDED:           { cls: 'verified', icon: '✓', label: 'Verified from archive documents' },
      PARTIALLY_GROUNDED: { cls: 'partial',  icon: '⚠', label: 'Partially verified — some claims not confirmed' },
      UNGROUNDED:         { cls: 'info',     icon: 'ℹ', label: 'Archive note — verify independently' },
    };
    const { cls, icon, label } = cfg[status] || cfg['UNGROUNDED'];
    badge.classList.add(cls);
    badge.innerHTML = `<span class="trust-icon">${icon}</span> ${label}`;
    return badge;
  }

  function buildFigurePlate(media) {
    const card = document.createElement('div');
    card.className = 'figure-plate-card';
    card.onclick = () => openLightbox(media);
    card.innerHTML = `
      <img class="figure-plate-thumb" src="/api/image/${encodeURIComponent(media.plate_filename)}" alt="Document Plate" loading="lazy" />
      <div class="figure-plate-info">
        <div class="figure-plate-title">${esc(media.plate_title || 'Document Plate')}</div>
        <div class="figure-plate-caption">${esc(media.plate_caption || 'Click to enlarge')}</div>
      </div>
      <div class="figure-plate-hint">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg> Enlarge
      </div>`;
    return card;
  }

  function buildSources(citations) {
    const sec = document.createElement('div');
    sec.className = 'sources-section';
    sec.innerHTML = `<div class="sources-header">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Verified in ${citations.length} source${citations.length > 1 ? 's' : ''}:
    </div>`;
    const grid = document.createElement('div');
    grid.className = 'sources-grid';
    citations.slice(0, 4).forEach((c, i) => {
      const name = c.doc || c.source || `Document ${i+1}`;
      const page = c.page ? ` · Page ${c.page}` : '';
      const snip = c.snippet || c.text || c.exact_quote || '';
      const card = document.createElement('div');
      card.className = 'source-card';
      card.innerHTML = `<div class="source-card-title">${esc(name)}${page}</div><div class="source-card-snippet">"${esc(snip)}"</div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    return sec;
  }

  function buildVerification(meta) {
    const det = document.createElement('details');
    det.className = 'reasoning-drawer';
    det.innerHTML = `<summary class="reasoning-summary">
      <span style="display:flex;align-items:center;gap:6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        How this was verified
      </span>
      <span class="reasoning-arrow">▼</span>
    </summary>`;
    const body = document.createElement('div');
    body.className = 'reasoning-body';
    if (meta.hops && meta.hops.length) {
      meta.hops.forEach(hop => {
        const step = document.createElement('div');
        step.className = 'verification-step';
        step.innerHTML = `<div class="step-num">${esc(hop.step || '•')}</div>
          <div class="step-content">
            <div class="step-action">${esc(hop.action || 'Verification')}</div>
            <div class="step-finding">${esc(hop.finding || hop.thought || '')}</div>
          </div>`;
        body.appendChild(step);
      });
    }
    if (meta.contradictions && meta.contradictions.length) {
      const warn = document.createElement('div');
      warn.style.cssText = 'margin-top:8px;padding:8px 10px;background:rgba(217,119,6,.1);border-radius:6px;font-size:12px;color:var(--gold)';
      warn.innerHTML = `<strong>Archival discrepancy noted:</strong> ${esc(meta.contradictions.join('; '))}`;
      body.appendChild(warn);
    } else {
      const ok = document.createElement('div');
      ok.style.cssText = 'margin-top:6px;font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:4px';
      ok.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--emerald)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> No conflicting records found.';
      body.appendChild(ok);
    }
    det.appendChild(body);
    return det;
  }

  function buildFollowUps(leads) {
    const sec = document.createElement('div');
    sec.className = 'followups-section';
    sec.innerHTML = `<div class="followups-header">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
      Suggested follow-ups:
    </div>`;
    const pills = document.createElement('div');
    pills.className = 'followups-pills';
    leads.slice(0, 3).forEach(lead => {
      const pill = document.createElement('button');
      pill.className = 'followup-pill';
      pill.textContent = lead;
      pill.onclick = () => submitQuestion(lead);
      pills.appendChild(pill);
    });
    sec.appendChild(pills);
    return sec;
  }

  function appendLoadingMsg() {
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    wrap.id = 'loading-indicator';
    wrap.innerHTML = `
      <div class="message-avatar assistant">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="message-body">
        <div class="message-bubble">
          <div class="loading-state">
            <div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <span class="loading-text" id="loading-status-text">Searching the archive…</span>
          </div>
        </div>
      </div>`;
    dom.chatMessages.appendChild(wrap);
    scrollBottom();

    const phrases = ['Searching archive records…','Reviewing source documents…','Cross-checking citations…','Formulating response…'];
    let i = 0;
    const iv = setInterval(() => {
      if (!$('loading-indicator')) { clearInterval(iv); return; }
      i = (i + 1) % phrases.length;
      const el = $('loading-status-text');
      if (el) el.textContent = phrases[i];
    }, 2800);
    return () => clearInterval(iv);
  }

  function removeLoadingMsg() {
    const el = $('loading-indicator');
    if (el) el.remove();
  }

  function scrollBottom() { dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight; }

  /* ──────────────────────────────────────────────────
     LIGHTBOX
  ────────────────────────────────────────────────── */
  function openLightbox(media) {
    dom.lightboxImg.src    = `/api/image/${encodeURIComponent(media.plate_filename)}`;
    dom.lightboxTitle.textContent  = media.plate_title || 'Document Plate';
    dom.lightboxCaption.textContent = media.plate_caption || '';
    dom.lightboxModal.classList.add('visible');
  }
  function closeLightbox() {
    dom.lightboxModal.classList.remove('visible');
    dom.lightboxImg.src = '';
  }

  /* ──────────────────────────────────────────────────
     SUBMIT QUESTION
  ────────────────────────────────────────────────── */
  async function submitQuestion(text) {
    const q = (text || dom.queryInput.value).trim();
    if (!q || isQuerying) return;

    let chat = getActiveChat();
    if (!chat) { startNewChat(); chat = getActiveChat(); }

    if (!chat.messages.length) {
      chat.title = q.slice(0, 36) + (q.length > 36 ? '…' : '');
      renderHistory();
    }

    const userMsg = { role: 'user', content: q, ts: Date.now() };
    chat.messages.push(userMsg);
    saveConversations();

    dom.welcomeCard.style.display = 'none';
    appendMsg(userMsg);
    dom.queryInput.value = '';
    dom.queryInput.style.height = 'auto';
    dom.btnSend.disabled = true;
    scrollBottom();

    isQuerying = true;
    const stopInterval = appendLoadingMsg();

    try {
      const res = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      stopInterval();
      removeLoadingMsg();
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      const aMsg = {
        role: 'assistant',
        content: data.answer || 'No relevant records found in the archive.',
        ts: Date.now(),
        meta: {
          grounding_status:    data.grounding_status,
          grounding_score:     data.grounding_score,
          citations:           data.citations || [],
          pinpointed_citations: data.pinpointed_citations || [],
          hops:                data.hops || [],
          rich_media:          data.rich_media || null,
          contradictions:      data.contradictions || [],
          investigation_leads: data.investigation_leads || []
        }
      };
      chat.messages.push(aMsg);
      saveConversations();
      appendMsg(aMsg);
      scrollBottom();
    } catch (err) {
      stopInterval();
      removeLoadingMsg();
      const errMsg = {
        role: 'assistant',
        content: 'I couldn\'t reach the archive. Please confirm the FastAPI server is running on port 8000 and try again.',
        ts: Date.now(),
        meta: { grounding_status: 'UNGROUNDED' }
      };
      chat.messages.push(errMsg);
      saveConversations();
      appendMsg(errMsg);
      scrollBottom();
    } finally {
      isQuerying = false;
      dom.queryInput.focus();
    }
  }

  /* ──────────────────────────────────────────────────
     SIDEBAR CONTROLS
  ────────────────────────────────────────────────── */
  function openMobileSidebar()  { dom.sidebar.classList.add('mobile-open'); dom.sidebarBackdrop.classList.add('mobile-open'); }
  function closeMobileSidebar() { dom.sidebar.classList.remove('mobile-open'); dom.sidebarBackdrop.classList.remove('mobile-open'); }
  function toggleSidebar() {
    if (window.innerWidth <= 860) {
      if (dom.sidebar.classList.contains('mobile-open')) closeMobileSidebar();
      else openMobileSidebar();
    } else {
      dom.sidebar.classList.toggle('collapsed');
    }
  }

  /* ──────────────────────────────────────────────────
     WIRE EVENT LISTENERS
  ────────────────────────────────────────────────── */
  function wire() {
    // Theme
    dom.themeBtn && dom.themeBtn.addEventListener('click', toggleTheme);

    // Sidebar
    dom.btnNewChat      && dom.btnNewChat.addEventListener('click',      startNewChat);
    dom.btnMenuToggle   && dom.btnMenuToggle.addEventListener('click',   toggleSidebar);
    dom.sidebarBackdrop && dom.sidebarBackdrop.addEventListener('click', closeMobileSidebar);

    // Clear history button (if present)
    const btnClear = $('btn-clear-history');
    if (btnClear) btnClear.addEventListener('click', () => {
      conversations = [];
      saveConversations();
      startNewChat();
    });

    // Welcome suggestion cards
    document.querySelectorAll('.suggestion-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = btn.getAttribute('data-q');
        if (q) submitQuestion(q);
      });
    });

    // Textarea auto-grow
    dom.queryInput.addEventListener('input', () => {
      dom.queryInput.style.height = 'auto';
      dom.queryInput.style.height = Math.min(dom.queryInput.scrollHeight, 160) + 'px';
      dom.btnSend.disabled = !dom.queryInput.value.trim();
    });
    dom.queryInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
    });
    dom.btnSend.addEventListener('click', () => submitQuestion());

    // Lightbox
    dom.btnCloseLightbox.addEventListener('click', closeLightbox);
    dom.lightboxModal.addEventListener('click', e => { if (e.target === dom.lightboxModal) closeLightbox(); });
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  }

  /* ──────────────────────────────────────────────────
     INIT
  ────────────────────────────────────────────────── */
  initTheme();
  loadConversations();
  wire();

  // Silent health ping
  fetch('/api/health').catch(() => {});

})();
</script>
</body>
</html>
